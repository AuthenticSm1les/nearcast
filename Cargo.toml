[package]
name = "nearcast"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Quick Share (Nearby Share) daemon and command-line client for Linux"
repository = "https://github.com/AuthenticSm1les/nearcast"
readme = "README.md"
keywords = ["quick-share", "nearby-share", "android", "bluetooth", "file-transfer"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "nearcastd"
path = "src/bin/nearcastd.rs"

[[bin]]
name = "nearcast"
path = "src/bin/nearcast.rs"

[[bin]]
name = "nearcast-netd"
path = "src/bin/nearcast-netd.rs"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
base64 = "0.22"
bluer = { version = "0.17", features = ["bluetoothd", "rfcomm"] }
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
futures-util = "0.3.34"
hkdf = "0.12"
hmac = "0.12"
hostname = "0.4.2"
mdns-sd = "0.21.7"
mime_guess = "2.0.5"
nix = { version = "0.32.0", features = ["fs", "user", "net", "time", "inotify"] }
p256 = { version = "0.13", features = ["ecdh"] }
prost = "0.13"
rand = "0.9"
rtnetlink = "0.24"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "fs", "process"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wl-nl80211 = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
