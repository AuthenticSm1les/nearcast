<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.nearcast.Netd1"/>
  </policy>
  <!-- Anyone may call; netd asks polkit before acting. -->
  <policy context="default">
    <allow send_destination="org.nearcast.Netd1"/>
  </policy>
</busconfig>
